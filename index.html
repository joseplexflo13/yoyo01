<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Josep Controler - Mis Tareas</title>

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  </script>

  <!-- Tipografía Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Estilos propios -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-50 min-h-screen font-sans text-gray-800 antialiased">

  <!-- ==================== HEADER ==================== -->
  <header class="bg-gradient-to-r from-indigo-600 to-blue-500 shadow-md">
    <div class="max-w-lg mx-auto px-4 py-4 flex items-center gap-2">
      <span class="text-2xl leading-none">📋</span>
      <h1 class="text-white text-lg font-bold tracking-wide">Josep Controler</h1>
    </div>
  </header>

  <main class="max-w-lg mx-auto px-4 py-6">

    <!-- ==================== VISTA: INICIO ==================== -->
    <section id="view-home">
      <div class="space-y-8">

        <!-- Grupo 1 -->
        <div>
          <button type="button" id="home-registro" class="home-btn home-btn-primary">
            <span class="home-btn-icon">➕</span>
            <span>Registrar tarea</span>
          </button>
        </div>

        <!-- Grupo 2 -->
        <div>
          <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wide mb-3 px-1">Mis tareas</h2>
          <div class="space-y-3">
            <button type="button" class="home-btn home-btn-type" data-type="Trabajo">
              <span class="home-btn-icon">💼</span>
              <span>Trabajo</span>
            </button>
            <button type="button" class="home-btn home-btn-type" data-type="Personal">
              <span class="home-btn-icon">👤</span>
              <span>Personal</span>
            </button>
            <button type="button" class="home-btn home-btn-type" data-type="Educación">
              <span class="home-btn-icon">🎓</span>
              <span>Educación</span>
            </button>
          </div>
        </div>

      </div>
    </section>

    <!-- ==================== VISTA: REGISTRO ==================== -->
    <section id="view-registro" class="hidden">
      <div class="flex items-center gap-3 mb-4">
        <button type="button" id="btn-home-from-registro" class="circle-btn" aria-label="Inicio" title="Inicio">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l9-9 9 9M4.5 10.5V21a1 1 0 001 1h4.5v-6h4v6H18a1 1 0 001-1V10.5" />
          </svg>
        </button>
        <h2 class="text-xl font-semibold text-gray-800">Registrar nueva tarea</h2>
      </div>

      <div class="bg-white rounded-2xl shadow-lg p-6">
        <form id="task-form" class="space-y-4">

          <div>
            <label for="task-type" class="block text-sm font-medium text-gray-700 mb-1">Tipo</label>
            <select id="task-type" required
              class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-gray-700 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"></select>
          </div>

          <div>
            <label for="task-name" class="block text-sm font-medium text-gray-700 mb-1">Tarea</label>
            <input type="text" id="task-name" required placeholder="Ej: Preparar informe mensual"
              class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
          </div>

          <div>
            <label for="task-subtask" class="block text-sm font-medium text-gray-700 mb-1">
              Subtarea <span class="text-gray-400 font-normal">(opcional)</span>
            </label>
            <input type="text" id="task-subtask" placeholder="Ej: Reunir datos de ventas"
              class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
          </div>

          <button type="submit" id="submit-btn"
            class="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-indigo-600 to-blue-500 text-white font-semibold rounded-lg py-3 hover:opacity-90 active:scale-[0.98] transition disabled:opacity-60 disabled:cursor-not-allowed">
            <svg id="submit-spinner" class="hidden animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            <span id="submit-btn-text">Guardar tarea</span>
          </button>
        </form>

        <div id="form-message" class="hidden mt-4 rounded-lg px-4 py-3 text-sm font-medium"></div>
      </div>
    </section>

    <!-- ==================== VISTA: MIS TAREAS ==================== -->
    <section id="view-tareas" class="hidden">
      <div class="flex items-center justify-between mb-4">
        <button type="button" id="btn-home-from-tareas" class="circle-btn" aria-label="Inicio" title="Inicio">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l9-9 9 9M4.5 10.5V21a1 1 0 001 1h4.5v-6h4v6H18a1 1 0 001-1V10.5" />
          </svg>
        </button>
        <h2 id="tareas-title" class="text-xl font-semibold text-gray-800">Tareas</h2>
        <button type="button" id="btn-add-from-tareas" class="circle-btn circle-btn-primary" aria-label="Registrar tarea" title="Registrar tarea">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
        </button>
      </div>

      <div class="flex justify-end mb-4">
        <button id="refresh-btn" class="inline-flex items-center gap-1 text-sm font-medium text-indigo-600 hover:text-indigo-800 transition">
          <span>🔄</span> Actualizar
        </button>
      </div>

      <!-- Estados de carga / error -->
      <div id="tasks-loading" class="hidden flex justify-center py-10">
        <svg class="animate-spin h-8 w-8 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>
      </div>

      <div id="tasks-error" class="hidden bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 text-sm mb-4"></div>

      <!-- Lista de tareas -->
      <div id="tasks-list" class="space-y-3"></div>
    </section>

  </main>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
